name: Build

on:
  workflow_dispatch: {}
  push:
    branches:
      - 'ci/**'
      - 'feat/**'

jobs:
  build:
    name: Build unsigned DMG (arm64)
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build DMG
        env:
          # No Apple ID/notarization credentials are configured for this
          # workflow, so skip codesigning entirely. electron-builder-notarize
          # (the afterSign hook) already no-ops when it can't find notarization
          # credentials, so it does not need to be disabled separately.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: yarn dist -m --arm64

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: newkap-arm64-dmg
          path: dist/*.dmg
          if-no-files-found: error

  test:
    name: Test (main process)
    # test/*.ts mocks electron (via _moduleAliases) and only exercises ffmpeg
    # on fixtures, so it doesn't need macOS. Runs on ubuntu-latest, which is
    # far less contended than the macOS runner pool `build` needs, so other
    # branches always have a fast lane to run their tests independent of any
    # macOS-runner backlog.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run main-process tests
        run: yarn test:main
